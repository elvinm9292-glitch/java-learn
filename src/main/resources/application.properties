spring.application.name=bank-api
spring.profiles.active=local
spring.config.import=vault://db/atlas-postgres

spring.cloud.vault.uri=http://vault.service.consul:8200
spring.cloud.vault.authentication=TOKEN
spring.cloud.vault.token=${VAULT_TOKEN:s.zyRGwTADpPuJgC9CzebP54dx}
spring.cloud.vault.kv.enabled=false

spring.datasource.url=${datasource.atlas-postgres.host}
spring.datasource.username=${datasource.atlas-postgres.username}
spring.datasource.password=${datasource.atlas-postgres.password}
spring.datasource.hikari.schema=java_learn
spring.jpa.properties.hibernate.default_schema=java_learn
# DDL: none -> сначала убедиться, что активна схема java_learn, и только потом update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
